<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>VidOffice</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Figtree:wght@400;500;600&family=Pixelify+Sans:wght@500;700&display=swap" rel="stylesheet">
<style>
  :root {
    --tinta: #2B2740; --tinta2: #3D3860; --papel: #FBF8F2; --papel2: #F3EEE3; --linha: #E3DCCD;
    --suave: #766F8C; --corredor: #EBDCC4; --foco: #4C7DF0; --ok: #2E9E6B; --aviso: #E0A12A;
    --titulo: "Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
    --corpo: "Figtree", "Segoe UI", system-ui, sans-serif;
    --pixel: "Pixelify Sans", "Segoe UI", system-ui, sans-serif;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body { margin: 0; background: var(--tinta); color: var(--tinta); font: 15px/1.5 var(--corpo); overflow: hidden; }
  button { font: inherit; color: inherit; cursor: pointer; }
  :focus-visible { outline: 3px solid var(--foco); outline-offset: 2px; }

  /* ------- barra de cima ------- */
  header { height: 58px; display: flex; align-items: center; gap: 16px; padding: 0 18px; color: #F3EEE3; background: var(--tinta); }
  .marca { font: 700 22px/1 var(--pixel); letter-spacing: .5px; }
  .marca b { color: #F2B84B; font-weight: 700; }
  .projeto-btn { display: flex; align-items: center; gap: 8px; background: var(--tinta2); border: 0; border-radius: 10px; padding: 8px 14px;
                 color: #F3EEE3; max-width: 320px; font-weight: 600; }
  .projeto-btn span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .pips { display: flex; gap: 5px; margin-left: 4px; }
  .pip { width: 11px; height: 11px; border-radius: 3px; background: #57517D; transition: background .25s; }
  .pip.on { background: var(--cor); }
  .espaco { flex: 1; }
  .btn-topo { background: transparent; border: 1.5px solid #5B5580; border-radius: 10px; padding: 7px 13px; color: #F3EEE3; }
  .btn-topo:hover { background: var(--tinta2); }
  .btn-topo[aria-pressed="true"] { background: #F2B84B; border-color: #F2B84B; color: var(--tinta); font-weight: 600; }
  .modo { font-size: 13px; padding: 4px 10px; border-radius: 999px; background: #57517D; }
  .modo.ia { background: var(--ok); }

  /* ------- palco ------- */
  main { height: calc(100% - 58px); display: flex; background: var(--corredor); position: relative; }
  #palco { flex: 1; min-width: 0; display: flex; align-items: center; justify-content: center; padding: 14px; position: relative; }
  #mundo { position: relative; width: min(100%, calc((100vh - 58px - 28px) * 1.6)); aspect-ratio: 640 / 400; }
  #mapa { width: 100%; height: 100%; display: block; image-rendering: pixelated; border-radius: 6px; box-shadow: 0 6px 0 rgba(43,39,64,.25); }
  .etiqueta { position: absolute; transform: translate(-50%, -100%); display: flex; align-items: center; gap: 5px; white-space: nowrap; pointer-events: none;
              background: rgba(43,39,64,.92); color: #fff; font: 500 12px/1 var(--pixel); padding: 4px 7px 4px 6px; border-radius: 7px; }
  .etiqueta i { width: 7px; height: 7px; border-radius: 2px; background: var(--cor); display: block; }
  .etiqueta em { font-style: normal; font-weight: 700; }
  .etiqueta em.t { color: #F2B84B; } .etiqueta em.a { color: #9AF0C2; } .etiqueta em.p { color: #fff; animation: pulso 1s steps(2) infinite; }
  .sala { position: absolute; transform: none; background: transparent; color: rgba(43,39,64,.7); font: 700 11px/1 var(--pixel); padding: 0; pointer-events: none; }
  #dica { position: absolute; left: 50%; bottom: 10px; transform: translateX(-50%); background: rgba(43,39,64,.9); color: #fff; font-size: 13px;
          padding: 7px 14px; border-radius: 999px; pointer-events: none; max-width: 92%; text-align: center; }
  #paleta { position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%); display: none; gap: 6px; flex-wrap: wrap; justify-content: center;
            background: var(--papel); border-radius: 14px; padding: 8px; box-shadow: 0 4px 0 rgba(43,39,64,.2); max-width: 96%; }
  #paleta.on { display: flex; }
  #paleta button { background: var(--papel2); border: 1.5px solid var(--linha); border-radius: 8px; padding: 5px 10px; font-size: 13px; }
  #paleta button:hover { border-color: var(--tinta2); }
  #paleta .perigo { color: #B3412E; }
  #paleta .ok { background: var(--tinta); color: #fff; border-color: var(--tinta); }

  /* ------- painel do funcionário ------- */
  #painel { width: 440px; max-width: 100%; background: var(--papel); border-left: 4px solid var(--tinta); display: none; flex-direction: column; min-height: 0; }
  #painel.aberto { display: flex; }
  .p-topo { display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-bottom: 1.5px solid var(--linha); background: var(--papel2); }
  .p-topo canvas { width: 44px; height: 56px; image-rendering: pixelated; flex: none; background: var(--cor-fraca, #fff); border-radius: 8px; }
  .p-topo h2 { margin: 0; font: 700 20px/1.1 var(--titulo); }
  .p-topo p { margin: 2px 0 0; color: var(--suave); font-size: 13px; }
  .p-topo .grow { flex: 1; min-width: 0; }
  .icone { background: none; border: 0; font-size: 20px; line-height: 1; padding: 6px 8px; border-radius: 8px; color: var(--suave); }
  .icone:hover { background: var(--linha); color: var(--tinta); }
  .conversa { flex: 1; min-height: 0; overflow-y: auto; padding: 16px; display: flex; flex-direction: column; gap: 14px; }
  .msg-eu { align-self: flex-end; max-width: 86%; background: var(--tinta); color: #fff; padding: 9px 13px; border-radius: 14px 14px 3px 14px; font-size: 14px; white-space: pre-wrap; overflow-wrap: anywhere; }
  .msg-func { align-self: flex-start; max-width: 100%; width: 100%; background: #fff; border: 1.5px solid var(--linha); border-left: 5px solid var(--cor); border-radius: 4px 14px 14px 14px; padding: 12px 14px; }
  .msg-func.aprovada { border-color: var(--ok); border-left-color: var(--ok); background: #F4FBF7; }
  .msg-cab { display: flex; align-items: center; gap: 8px; margin-bottom: 8px; font-size: 12px; color: var(--suave); flex-wrap: wrap; }
  .selo { font-size: 11px; padding: 2px 8px; border-radius: 999px; background: var(--papel2); color: var(--suave); }
  .selo.ok { background: #DDF3E8; color: #1F7A52; } .selo.ex { background: #FBEBC8; color: #8A5E0C; } .selo.man { background: #E3E8F8; color: #3B58B5; }
  .md p { margin: 0 0 8px; } .md ul, .md ol { margin: 0 0 8px; padding-left: 20px; } .md blockquote { margin: 0 0 8px; padding: 6px 10px; background: var(--papel2); border-left: 3px solid var(--linha); color: var(--suave); font-size: 13px; }
  .md table { border-collapse: collapse; font-size: 12.5px; margin: 0 0 8px; display: block; overflow-x: auto; }
  .md th, .md td { border: 1px solid var(--linha); padding: 4px 7px; text-align: left; vertical-align: top; }
  .md mark { background: #FFE9A8; padding: 0 3px; border-radius: 3px; }
  .md :last-child { margin-bottom: 0; }
  .acoes { display: flex; gap: 8px; margin-top: 10px; flex-wrap: wrap; }
  .b { border: 1.5px solid var(--tinta); background: transparent; border-radius: 9px; padding: 6px 12px; font-size: 13.5px; font-weight: 600; }
  .b:hover { background: var(--papel2); }
  .b.forte { background: var(--ok); border-color: var(--ok); color: #fff; } .b.forte:hover { background: #247F55; }
  .b.escuro { background: var(--tinta); color: #fff; } .b.escuro:hover { background: var(--tinta2); }
  .b:disabled { opacity: .5; cursor: default; }
  textarea.edit { width: 100%; min-height: 220px; font: 14px/1.5 var(--corpo); border: 1.5px solid var(--tinta2); border-radius: 10px; padding: 10px; resize: vertical; background: #fff; }
  .vazio { color: var(--suave); text-align: center; padding: 28px 12px; }
  .digitando { align-self: flex-start; display: flex; gap: 5px; padding: 12px 14px; background: #fff; border: 1.5px solid var(--linha); border-radius: 14px; }
  .digitando span { width: 7px; height: 7px; background: var(--cor); border-radius: 2px; animation: pulo 1s infinite; }
  .digitando span:nth-child(2) { animation-delay: .15s; } .digitando span:nth-child(3) { animation-delay: .3s; }
  .erro { align-self: stretch; background: #FDECE8; color: #8F2B18; border-radius: 10px; padding: 9px 12px; font-size: 13.5px; }
  .envio { border-top: 1.5px solid var(--linha); padding: 12px 16px 14px; background: var(--papel2); }
  .sugestoes { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 8px; }
  .sugestoes button { border: 1.5px solid var(--linha); background: #fff; border-radius: 999px; padding: 3px 11px; font-size: 12.5px; }
  .sugestoes button:hover { border-color: var(--tinta2); }
  .linha-envio { display: flex; gap: 8px; align-items: flex-end; }
  .linha-envio textarea { flex: 1; resize: none; min-height: 56px; max-height: 140px; border: 1.5px solid var(--linha); border-radius: 12px; padding: 10px 12px; font: inherit; background: #fff; }
  .linha-envio textarea:focus { border-color: var(--tinta2); outline: none; }
  .linha-envio .b { height: 44px; }

  /* arquivos e entrega */
  .pasta { margin-bottom: 14px; }
  .pasta h3 { margin: 0 0 6px; font: 700 15px/1.2 var(--titulo); display: flex; align-items: center; gap: 8px; }
  .pasta .zona { border: 2px dashed var(--linha); border-radius: 10px; padding: 8px 10px; background: #fff; font-size: 13.5px; }
  .pasta .zona.arrasta { border-color: var(--foco); background: #EEF3FE; }
  .arq { display: flex; align-items: center; gap: 8px; padding: 4px 0; border-bottom: 1px solid var(--papel2); }
  .arq a { color: var(--tinta); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; flex: 1; }
  .arq small { color: var(--suave); }
  .lista-ok { list-style: none; padding: 0; margin: 0 0 12px; }
  .lista-ok li { display: flex; gap: 8px; padding: 5px 0; align-items: center; }
  .caixa { width: 16px; height: 16px; border-radius: 4px; border: 2px solid var(--linha); flex: none; display: inline-flex; align-items: center; justify-content: center; font-size: 11px; color: #fff; }
  .caixa.on { background: var(--ok); border-color: var(--ok); }
  .personalizar { display: grid; grid-template-columns: 1fr auto auto; gap: 8px; padding: 10px 16px; background: var(--papel2); border-bottom: 1.5px solid var(--linha); align-items: center; }
  .personalizar[hidden] { display: none; }
  .personalizar input[type=text] { border: 1.5px solid var(--linha); border-radius: 8px; padding: 6px 9px; font: inherit; }
  .personalizar input[type=color] { width: 38px; height: 34px; border: 1.5px solid var(--linha); border-radius: 8px; padding: 2px; background: #fff; }

  /* ------- janelas ------- */
  .fundo { position: fixed; inset: 0; background: rgba(43,39,64,.6); display: none; align-items: center; justify-content: center; padding: 16px; z-index: 20; }
  .fundo.aberto { display: flex; }
  .janela { background: var(--papel); border-radius: 16px; padding: 22px; width: min(460px, 100%); box-shadow: 0 8px 0 rgba(0,0,0,.2); }
  .janela h2 { margin: 0 0 14px; font: 700 22px/1.1 var(--titulo); }
  .janela label { display: block; font-weight: 600; font-size: 13.5px; margin: 12px 0 4px; }
  .janela input[type=text], .janela input[type=password] { width: 100%; border: 1.5px solid var(--linha); border-radius: 10px; padding: 9px 11px; font: inherit; background: #fff; }
  .janela p.nota { color: var(--suave); font-size: 13px; margin: 6px 0 0; }
  .janela .acoes { justify-content: flex-end; margin-top: 18px; }
  .lista-projetos { max-height: 260px; overflow-y: auto; margin: 0 0 12px; padding: 0; list-style: none; }
  .lista-projetos li button { width: 100%; text-align: left; background: #fff; border: 1.5px solid var(--linha); border-radius: 10px; padding: 8px 12px; margin-bottom: 6px; }
  .lista-projetos li button:hover, .lista-projetos li button.atual { border-color: var(--tinta); }
  .lista-projetos small { color: var(--suave); display: block; }

  @keyframes pulso { 50% { opacity: .35; } }
  @keyframes pulo { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-5px); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  @media (max-width: 900px) {
    #painel { position: absolute; inset: 0; width: 100%; z-index: 10; border-left: 0; }
    .pips, .modo, .marca { display: none; }
    header { gap: 8px; padding: 0 10px; } .projeto-btn { max-width: 170px; } .btn-topo { padding: 6px 9px; font-size: 13px; }
  }
</style>
</head>
<body>
<header>
  <div class="marca">Vid<b>Office</b></div>
  <button class="projeto-btn" id="btn-projeto" aria-haspopup="dialog"><span id="nome-projeto">Escolher projeto</span><span aria-hidden="true">▾</span></button>
  <div class="pips" id="pips" aria-label="Etapas aprovadas"></div>
  <div class="espaco"></div>
  <span class="modo" id="modo"></span>
  <button class="btn-topo" id="btn-decorar" aria-pressed="false">Decorar</button>
  <button class="btn-topo" id="btn-config">Configurações</button>
</header>
<main>
  <div id="palco">
    <div id="mundo">
      <canvas id="mapa" width="1280" height="800"></canvas>
      <div id="etiquetas"></div>
    </div>
    <div id="dica">Ande com as setas ou WASD. Clique em um funcionário, ou aperte E perto dele, para conversar.</div>
    <div id="paleta" role="toolbar" aria-label="Decoração"></div>
  </div>
  <aside id="painel" aria-live="polite"></aside>
</main>

<div class="fundo" id="j-projetos"><div class="janela" role="dialog" aria-label="Projetos">
  <h2>Projetos</h2>
  <ul class="lista-projetos" id="lista-projetos"></ul>
  <label for="np-titulo">Novo projeto</label>
  <input type="text" id="np-titulo" placeholder="Ex.: GTA 6: tudo que mudou" maxlength="120">
  <label for="np-tema">Tema ou nicho <small style="font-weight:400;color:var(--suave)">(opcional)</small></label>
  <input type="text" id="np-tema" placeholder="Ex.: jogos, tecnologia, música" maxlength="300">
  <div class="acoes"><button class="b" id="np-fechar">Fechar</button><button class="b escuro" id="np-criar">Criar projeto</button></div>
</div></div>

<div class="fundo" id="j-config"><div class="janela" role="dialog" aria-label="Configurações">
  <h2>Configurações</h2>
  <label for="cfg-chave">Chave da IA (Anthropic)</label>
  <input type="password" id="cfg-chave" autocomplete="off" placeholder="Cole a chave aqui">
  <p class="nota" id="cfg-chave-nota"></p>
  <label for="cfg-modelo">Modelo</label>
  <input type="text" id="cfg-modelo" autocomplete="off">
  <p class="nota">A chave fica só no seu computador, na pasta de dados. Sem chave, os funcionários respondem em modo exemplo.</p>
  <div class="acoes"><button class="b" id="cfg-remover">Remover chave</button><button class="b" id="cfg-fechar">Fechar</button><button class="b escuro" id="cfg-salvar">Salvar</button></div>
</div></div>

<script>

const CABELO = ["#2B2118", "#5A3A22", "#B5782E", "#1E1A2B", "#8A3B2A", "#D8B45A", "#3B2A4A", "#4A4A4A"];

  ["estante", 430, 238], ["impressora", 560, 252], ["planta", 438, 356], ["planta", 594, 356], ["caixas", 572, 320],

/* =====================================================================
   Estado
   ===================================================================== */
const S = { funcionarios: [], porId: {}, config: null, projetos: [], projeto: null, personal: { decoracao: null, funcionarios: {} },
            decoracao: [], aberto: null, editandoDeco: false, sel: null, erros: {}, pensando: new Set() };
const jog = { x: 320, y: 352, dir: "u", f: 0, tempo: 0, andando: false };

const $ = (s) => document.querySelector(s);
const reduzMov = matchMedia("(prefers-reduced-motion: reduce)").matches;

function el(tag, cls, texto) { const e = document.createElement(tag); if (cls) e.className = cls; if (texto != null) e.textContent = texto; return e; }
async function api(metodo, caminho, corpo) {
  const r = await fetch(caminho, { method: metodo, headers: { "X-VidOffice": "1", "Content-Type": "application/json" }, body: corpo ? JSON.stringify(corpo) : undefined });
  const j = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(j.erro || "Algo deu errado.");

let alvoPerto = null;
function destaque(m, t) {

}
function desenharMundo(t) {
  cx.setTransform(2, 0, 0, 2, 0, 0); cx.imageSmoothingEnabled = false;
  if (!fundo) construirFundo();
  cx.drawImage(fundo, 0, 0, L, A);
  for (const d of S.decoracao) if (TAPETES.has(d.tipo)) item(d.tipo, d.x, d.y);
  const objs = [];
  for (const d of S.decoracao) if (!TAPETES.has(d.tipo)) objs.push({ y: d.y + TIPOS[d.tipo][1], desenhar: () => item(d.tipo, d.x, d.y) });
  const aparencia = (id) => { const [p, c, e] = APARENCIA[id] || APARENCIA.arquivos; return { pele: PELE[p], cabelo: CABELO[c], estilo: e }; };
  for (const f of S.funcionarios) {
    const m = MESAS[f.id], fn = func(f.id), est = estadoDe(f.id);
    objs.push({ y: m.y + 5, desenhar: () => pessoaSentada(m.x + m.w / 2, m.y + 5, { ...aparencia(f.id), camisa: fn.cor }, t, est === "trabalhando") });
    objs.push({ y: m.y + 16, desenhar: () => mesaFunc(f.id, m, fn.cor, est, t) });
  }
  const am = MESAS.arquivos;
  objs.push({ y: am.y + 5, desenhar: () => pessoaSentada(am.x + am.w / 2, am.y + 5, { ...aparencia("arquivos"), camisa: "#6B7C93" }, t, false) });
  objs.push({ y: am.y + 16, desenhar: () => mesaFunc("arquivos", am, "#6B7C93", "livre", t) });
  objs.push({ y: jog.y, desenhar: () => pessoa(jog.x, jog.y, { pele: PELE[1], cabelo: "#2B2118", estilo: 0, camisa: "#F2B84B", calca: "#3B5BA5", dir: jog.dir, f: jog.f, andando: jog.andando }) });
  objs.sort((a, b) => a.y - b.y).forEach((o) => o.desenhar());
  if (alvoPerto && !S.editandoDeco) destaque(MESAS[alvoPerto], t);
  if (S.editandoDeco && S.sel != null) { const d = S.decoracao[S.sel]; if (d) { const [w, h] = TIPOS[d.tipo]; cx.strokeStyle = "#F2B84B"; cx.lineWidth = 1; cx.setLineDash([3, 2]); cx.strokeRect(d.x - 1.5, d.y - 1.5, w + 3, h + 3); cx.setLineDash([]); } }
}

function solidos() {
  const r = FAIXAS.map((f) => ({ x: f.x, y: f.y, w: f.w, h: f.h }));
  for (const d of S.decoracao) { const [w, h, s] = TIPOS[d.tipo]; if (s) r.push({ x: d.x, y: d.y + h * 0.4, w, h: h * 0.6 }); }
  for (const m of Object.values(MESAS)) r.push({ x: m.x, y: m.y + 4, w: m.w, h: 12 });
  r.push({ x: -10, y: -10, w: L + 20, h: 10 }, { x: -10, y: A, w: L + 20, h: 10 }, { x: -10, y: 0, w: 10, h: A }, { x: L, y: 0, w: 10, h: A });
  return r;
}
function bate(px, py, lista) {
  const a = { x: px - 4, y: py - 3, w: 8, h: 3 };
  return lista.some((r) => a.x < r.x + r.w && a.x + a.w > r.x && a.y < r.y + r.h && a.y + a.h > r.y);
}
function mover(dt) {
  if (S.editandoDeco || S.aberto && document.activeElement && /TEXTAREA|INPUT/.test(document.activeElement.tagName)) { jog.andando = false; return; }
  let dx = (teclas.has("ArrowRight") || teclas.has("d") ? 1 : 0) - (teclas.has("ArrowLeft") || teclas.has("a") ? 1 : 0);
  let dy = (teclas.has("ArrowDown") || teclas.has("s") ? 1 : 0) - (teclas.has("ArrowUp") || teclas.has("w") ? 1 : 0);
  jog.andando = !!(dx || dy);
  if (!jog.andando) { jog.tempo = 0; jog.f = 0; return; }
  jog.dir = dx ? (dx > 0 ? "r" : "l") : (dy > 0 ? "d" : "u");
  jog.tempo += dt; jog.f = Math.floor(jog.tempo * 9) % 4;
  const n = Math.hypot(dx, dy), v = 76 * dt, lista = solidos();
  const nx = jog.x + dx / n * v, ny = jog.y + dy / n * v;
  if (!bate(nx, jog.y, lista)) jog.x = nx;
  if (!bate(jog.x, ny, lista)) jog.y = ny;
}
function proximo() {
  let melhor = null, d0 = 34;
  const alvos = [...S.funcionarios.map((f) => ({ id: f.id, x: MESAS[f.id].x + MESAS[f.id].w / 2, y: MESAS[f.id].y + 22 })), { id: "arquivos", x: MESAS.arquivos.x + MESAS.arquivos.w / 2, y: MESAS.arquivos.y + 22 }];
  for (const a of alvos) { const d = Math.hypot(a.x - jog.x, a.y - jog.y); if (d < d0) { d0 = d; melhor = a.id; } }
  return melhor;
}
let ultimo = performance.now();
function quadro(agora) {
  const dt = Math.min(0.05, (agora - ultimo) / 1000); ultimo = agora;
  mover(dt);
  desenharMundo(agora / 1000);
  const tag = $("#tag-eu"); if (tag) { tag.style.left = (jog.x / L * 100) + "%"; tag.style.top = ((jog.y - 24) / A * 100) + "%"; }
  const perto = S.editandoDeco ? null : proximo();

  else if (perto) dica.textContent = "Aperte E para falar com " + (perto === "arquivos" ? "o Arq (arquivos)" : func(perto).nome);

/* clique e arrasto no mapa */
function ponto(e) { const r = cv.getBoundingClientRect(); return { x: (e.clientX - r.left) / r.width * L, y: (e.clientY - r.top) / r.height * A }; }
function achar(p) {
  for (const f of S.funcionarios) { const m = MESAS[f.id]; if (p.x >= m.x - 4 && p.x <= m.x + m.w + 4 && p.y >= m.y - 28 && p.y <= m.y + 18) return f.id; }
  const a = MESAS.arquivos; if (p.x >= a.x && p.x <= a.x + a.w && p.y >= a.y - 28 && p.y <= a.y + 18) return "arquivos";
  for (const d of S.decoracao) if (d.tipo === "arquivo" && p.x >= d.x && p.x <= d.x + 16 && p.y >= d.y && p.y <= d.y + 26) return "arquivos";
  return null;
}
function itemEm(p) {
  for (let i = S.decoracao.length - 1; i >= 0; i--) { const d = S.decoracao[i], [w, h] = TIPOS[d.tipo]; if (p.x >= d.x && p.x <= d.x + w && p.y >= d.y && p.y <= d.y + h) return i; }
  return null;
}
let arrasto = null;
cv.addEventListener("pointerdown", (e) => {
  const p = ponto(e);
  if (S.editandoDeco) { S.sel = itemEm(p); if (S.sel != null) { arrasto = { dx: p.x - S.decoracao[S.sel].x, dy: p.y - S.decoracao[S.sel].y }; cv.setPointerCapture(e.pointerId); } return; }
  const id = achar(p); if (id) abrirFuncionario(id);
});
cv.addEventListener("pointermove", (e) => {
  const p = ponto(e);
  if (arrasto && S.sel != null) { const d = S.decoracao[S.sel], [w, h] = TIPOS[d.tipo]; d.x = Math.max(0, Math.min(L - w, Math.round(p.x - arrasto.dx))); d.y = Math.max(0, Math.min(A - h, Math.round(p.y - arrasto.dy))); }
  cv.style.cursor = S.editandoDeco ? (itemEm(p) != null ? "grab" : "default") : (achar(p) ? "pointer" : "default");
});

/* =====================================================================
   Texto: Markdown simples, sem HTML perigoso
   ===================================================================== */
const esc = (s) => s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
function inline(s) {
  return esc(s).replace(/\*\*(.+?)\*\*/g, "<strong>$1</strong>").replace(/\[(CONFERIR[^\]]*|pausa|ênfase|ritmo[^\]]*)\]/gi, "<mark>[$1]</mark>");
}
function md(texto) {
  const out = [], linhas = texto.replace(/\r/g, "").split("\n"); let i = 0;
  while (i < linhas.length) {
    const l = linhas[i];
    if (!l.trim()) { i++; continue; }
    if (l.startsWith(">")) { const b = []; while (i < linhas.length && linhas[i].startsWith(">")) b.push(linhas[i++].replace(/^>\s?/, "")); out.push("<blockquote>" + b.map(inline).join("<br>") + "</blockquote>"); continue; }
    if (/^\s*\|/.test(l)) {
      const b = []; while (i < linhas.length && /^\s*\|/.test(linhas[i])) b.push(linhas[i++]);
      const cel = (x) => x.trim().replace(/^\||\|$/g, "").split("|").map((c) => c.trim());
      const corpo = b.filter((x) => !/^\s*\|?[\s:-]+\|[\s|:-]*$/.test(x));
      out.push("<table>" + corpo.map((x, k) => "<tr>" + cel(x).map((c) => `<${k ? "td" : "th"}>${inline(c)}</${k ? "td" : "th"}>`).join("") + "</tr>").join("") + "</table>"); continue;
    }
    if (/^\s*([-*]|\d+\.)\s/.test(l)) {
      const itens = [], ehItem = (x) => /^\s*([-*]|\d+\.)\s/.test(x);
      while (i < linhas.length) {
        const x = linhas[i];
        if (!x.trim()) { let j = i; while (j < linhas.length && !linhas[j].trim()) j++; if (j < linhas.length && ehItem(linhas[j])) { i = j; continue; } break; }
        const m = x.match(/^(\s*)([-*]|\d+\.)\s+(.*)$/);
        if (m) { if (m[1].length >= 2 && itens.length) itens[itens.length - 1].filhos.push(m[3]); else itens.push({ ord: /\d/.test(m[2]), texto: m[3], filhos: [] }); }
        else if (/^\s{2,}\S/.test(x) && itens.length) itens[itens.length - 1].texto += " " + x.trim();
        else break;
        i++;
      }
      const tag = itens[0].ord ? "ol" : "ul";
      out.push(`<${tag}>` + itens.map((it) => "<li>" + inline(it.texto) + (it.filhos.length ? "<ul>" + it.filhos.map((f) => "<li>" + inline(f) + "</li>").join("") + "</ul>" : "") + "</li>").join("") + `</${tag}>`); continue;
    }
    const b = []; while (i < linhas.length && linhas[i].trim() && !/^\s*(\||>|([-*]|\d+\.)\s)/.test(linhas[i])) b.push(inline(linhas[i++]));
    out.push("<p>" + b.join("<br>") + "</p>");
  }
  return out.join("");
}

async function iniciar() {
  const [estado, pers, projetos] = await Promise.all([api("GET", "/api/estado"), api("GET", "/api/escritorio"), api("GET", "/api/projetos")]);
  S.funcionarios = estado.funcionarios; S.porId = Object.fromEntries(S.funcionarios.map((f) => [f.id, f])); S.config = estado.config; S.personal = pers; S.projetos = projetos;
  S.decoracao = (pers.decoracao || DECORACAO_PADRAO).map((d) => ({ ...d }));
  mostrarModo(); montarPaleta(); montarEtiquetas();
  const salvo = localStorage.getItem("vidoffice:projeto");
  const alvo = projetos.find((p) => p.id === salvo) || projetos[0];
  if (alvo) await selecionar(alvo.id); else abrirProjetos();
  requestAnimationFrame(quadro);
}
iniciar().catch((e) => { document.body.prepend(el("div", "erro", "Não consegui carregar o escritório: " + e.message)); });
window.__vidoffice = { S, jog, abrirFuncionario };
</script>
